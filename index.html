<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102f46">
  <title>Royal Match · 1–20 关试玩</title>
  <link rel="stylesheet" href="play.css">
  <script src="play.js?v=20261015-ui-alignment-33e1ba19" defer></script>
</head>
<body>
  <main id="stage">
    <canvas id="game" width="540" height="960" tabindex="0" aria-label="Royal Match 城堡与游戏棋盘"></canvas>
    <button id="exit-fullscreen" type="button">退出全屏</button>
    <section id="cover" aria-labelledby="title">
      <div class="intro">
        <p class="eyebrow">1—20 关 · 网页试玩</p>
        <h1 id="title">Royal Match</h1>
        <p>闯关收集星星，建造你的城堡花园。<br>背景音乐可在游戏设置中开关。</p>
        <button id="start" type="button">开始试玩</button>
        <progress id="progress" max="1" value="0" hidden aria-label="游戏加载进度"></progress>
        <p id="status" role="status" aria-live="polite">首次加载需要下载游戏资源，请稍候。</p>
        <p class="note">建议使用电脑上的 Chrome、Edge 或 Safari。<br>这是复现试玩版。</p>
      </div>
    </section>
  </main>
  <footer><span>关卡内：拖动交换 · L 选关 · R 重试</span><button id="fullscreen" type="button" disabled>全屏</button></footer>
</body>
</html>
